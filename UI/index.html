<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Risk Predictor | AI Health Analytics</title>
    <link rel="stylesheet" href="/ui/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0E1F2F 0%, #27425D 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        @font-face {
            font-family: 'Quiche Bold';
            src: local('Quiche Bold');
        }

        h1, h2, h3, .quiche-text {
            font-family: 'Quiche Bold', 'Poppins', sans-serif;
        }

        /* Navbar Styles */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(14, 31, 47, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(193, 141, 180, 0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #C18DB4, #87A7D0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
            transition: all 0.3s;
        }
        .logo:hover {
            transform: scale(1.05);
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 25px;
            transition: all 0.3s;
            font-weight: 500;
        }

        .nav-link:hover, .nav-link.active {
            color: #C18DB4;
            background: rgba(193, 141, 180, 0.1);
        }

        .right-nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .profile-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #C18DB4, #87A7D0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            color: #0E1F2F;
            font-weight: bold;
            font-size: 18px;
        }
        .profile-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(193,141,180,0.5);
        }

        .logout-btn {
            background: rgba(193, 141, 180, 0.2);
            border: 1px solid rgba(193, 141, 180, 0.3);
            padding: 8px 20px;
            border-radius: 25px;
            color: #E2CAD8;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .logout-btn:hover {
            background: rgba(193, 141, 180, 0.4);
        }

        /* Hero Section */
        .hero-section {
            text-align: center;
            margin: 60px 0 40px;
        }
        .hero-section h1 {
            font-size: 56px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #E2CAD8, #C18DB4, #87A7D0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .hero-section p {
            color: rgba(255,255,255,0.7);
            font-size: 18px;
        }

        /* Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            border: 1px solid rgba(193, 141, 180, 0.2);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: rgba(193, 141, 180, 0.5);
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px 60px;
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            font-size: 14px;
            color: #C18DB4;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(193, 141, 180, 0.3);
            border-radius: 15px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #C18DB4;
            background: rgba(255, 255, 255, 0.08);
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #C18DB4, #87A7D0);
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            color: #0E1F2F;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(193, 141, 180, 0.3);
        }

        .btn-outline {
            background: rgba(193, 141, 180, 0.2);
            border: 1px solid rgba(193, 141, 180, 0.3);
            padding: 10px 24px;
            border-radius: 25px;
            color: #E2CAD8;
            cursor: pointer;
        }

        /* Login Modal */
        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(14, 31, 47, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .login-card {
            background: rgba(39, 66, 93, 0.9);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 30px;
            width: 420px;
            text-align: center;
            border: 1px solid rgba(193, 141, 180, 0.3);
        }
        .login-card h2 {
            color: #E2CAD8;
            margin-bottom: 30px;
        }
        .login-card input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(193, 141, 180, 0.3);
            border-radius: 12px;
            color: white;
        }

        .hidden { display: none; }

        @media (max-width: 968px) {
            .two-columns {
                grid-template-columns: 1fr;
            }
            .hero-section h1 {
                font-size: 36px;
            }
            .nav-bar {
                flex-direction: column;
                gap: 15px;
                padding: 15px 20px;
            }
            .main-container {
                padding: 0 20px 40px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="logo" onclick="window.location.href='/app'">🩺 DIABETES RISK AI</div>
        <div class="nav-links">
            <a href="/app" class="nav-link active">Assessment</a>
            <a href="/dashboard" class="nav-link">Analytics</a>
            <a href="/doctors" class="nav-link">Doctors</a>
            <a href="/chatbot" class="nav-link">AI Assistant</a>
            <a href="/wellness" class="nav-link">Wellness</a>
        </div>
        <div class="right-nav">
            <div class="profile-icon" onclick="viewProfile()" title="My Profile">👤</div>
            <div id="userBadge" class="hidden">
                <button class="logout-btn" onclick="logout()">Exit</button>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="hero-section">
            <h1>Diabetes Risk<br>Assessment Platform</h1>
            <p style="color: rgba(255,255,255,0.7);">Advanced predictive analytics using deep learning</p>
        </div>

        <div class="two-columns">
            <div class="glass-card" style="padding: 40px;">
                <h3 class="quiche-text" style="color: #E2CAD8; margin-bottom: 30px;">Health Metrics</h3>
                <form id="predictionForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>AGE</label>
                            <input type="number" id="age" placeholder="Years" required>
                        </div>
                        <div class="form-group">
                            <label>GENDER</label>
                            <select id="gender">
                                <option value="Female">Female</option>
                                <option value="Male">Male</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>BMI</label>
                            <input type="number" step="0.1" id="bmi" placeholder="Body Mass Index" required>
                            <div style="margin-top: 12px; text-align: center;">
                                <a href="https://www.calculator.net/bmi-calculator.html" target="_blank" style="color: #87A7D0; text-decoration: none; font-weight: 500; display: block;">
                                    Don't know your BMI?
                                </a>
                                <a href="https://www.calculator.net/bmi-calculator.html" target="_blank" style="color: #C18DB4; text-decoration: none; font-weight: 600; display: block; margin-top: 4px;">
                                    Click here to calculate →
                                </a>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>GLUCOSE LEVEL</label>
                            <input type="number" id="glucose" placeholder="mg/dL" required>
                        </div>
                        <div class="form-group">
                            <label>HYPERTENSION</label>
                            <select id="hypertension">
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>HEART DISEASE</label>
                            <select id="heartDisease">
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>SMOKING HISTORY</label>
                        <select id="smoking">
                            <option value="never">Never Smoked</option>
                            <option value="former">Former Smoker</option>
                            <option value="current">Current Smoker</option>
                            <option value="not current">Not Current</option>
                            <option value="ever">Ever Smoked</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">ANALYZE RISK PROFILE →</button>
                </form>
            </div>

            <div id="resultsCard" class="glass-card" style="padding: 40px; display: none;"></div>
        </div>
    </div>

    <div id="loginModal" class="login-modal">
        <div class="login-card">
            <h2> Welcome Back</h2>
            <input type="text" id="loginUsername" placeholder="Username" value="Areeba">
            <input type="password" id="loginPassword" placeholder="Password" value="123456">
            <button class="btn-primary" style="width: 100%;" onclick="handleLogin()">Access Dashboard</button>
            <p style="margin-top: 20px; font-size: 12px; opacity: 0.6;">Demo: Username: Areeba | Password: 123456</p>
            <div id="loginError" style="color: #C18DB4; margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        let authToken = localStorage.getItem('authToken');
        let username = localStorage.getItem('username');

        if (authToken) {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('userBadge').classList.remove('hidden');
        }

        function viewProfile() {
            window.location.href = '/profile';
        }

        async function handleLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('http://127.0.0.1:5000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('username', username);
                    localStorage.setItem('userId', data.user_id);
                    window.location.href = '/app';
                } else {
                    document.getElementById('loginError').innerText = 'Invalid credentials';
                }
            } catch(e) {
                document.getElementById('loginError').innerText = 'Server not running. Start Flask backend!';
            }
        }

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('username');
            localStorage.removeItem('userId');
            window.location.href = '/';
        }

        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!localStorage.getItem('authToken')) {
                document.getElementById('loginModal').classList.remove('hidden');
                return;
            }

            const formData = {
                age: parseInt(document.getElementById('age').value),
                gender: document.getElementById('gender').value,
                bmi: parseFloat(document.getElementById('bmi').value),
                hypertension: parseInt(document.getElementById('hypertension').value),
                heart_disease: parseInt(document.getElementById('heartDisease').value),
                smoking_history: document.getElementById('smoking').value,
                blood_glucose_level: parseInt(document.getElementById('glucose').value)
            };

            const submitBtn = e.target.querySelector('.btn-primary');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = ' Analyzing...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('http://127.0.0.1:5000/api/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    const resultsCard = document.getElementById('resultsCard');
                    resultsCard.innerHTML = `
                        <div style="text-align: center; padding: 20px; border-radius: 20px; background: linear-gradient(135deg, rgba(193,141,180,0.2), rgba(135,167,208,0.2)); margin-bottom: 20px;">
                            <h3 style="color: #E2CAD8;">${result.prediction === 'Diabetic' ? ' High Risk Detected' : ' Low Risk Profile'}</h3>
                            <div style="font-size: 64px; font-weight: 800; margin: 20px 0;">${(result.probability * 100).toFixed(1)}%</div>
                            <p>Risk Level: ${result.risk_level}</p>
                        </div>
                        <div style="background: rgba(255,255,255,0.05); padding: 25px; border-radius: 20px; line-height: 1.8;">
                            <strong style="color: #C18DB4;"> AI Clinical Recommendations</strong><br><br>
                            ${result.dietary_advice.replace(/\n/g, '<br>')}
                        </div>
                        ${result.email_alert_sent ? '<div style="background: rgba(135,167,208,0.2); padding: 15px; border-radius: 15px; margin-top: 15px;"> Detailed report sent to your email</div>' : ''}
                        <div style="text-align: center; margin-top: 20px; font-size: 12px; opacity: 0.6;">${new Date(result.timestamp).toLocaleString()}</div>
                    `;
                    resultsCard.style.display = 'block';
                    resultsCard.scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert('Error: ' + (result.error || 'Unknown error'));
                }
            } catch(error) {
                alert('Server connection failed. Make sure Flask is running on port 5000');
            } finally {
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
