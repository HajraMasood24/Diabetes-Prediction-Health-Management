<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Risk Analysis AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0E1F2F 0%, #27425D 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .animated-bg::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(193,141,180,0.15) 0%, rgba(135,167,208,0.08) 50%, transparent 70%);
            animation: rotate 30s linear infinite;
        }

        .animated-bg::after {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(226,202,216,0.08) 0%, rgba(193,141,180,0.05) 50%, transparent 70%);
            animation: rotate-reverse 25s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotate-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            margin-bottom: 60px;
        }

        .hero h1 {
            font-family: 'Cormorant Upright', serif;
            font-size: 72px;
            font-weight: 700;
            background: linear-gradient(135deg, #E2CAD8, #C18DB4, #87A7D0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .hero p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Button Container */
        .button-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 60px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 42px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #C18DB4, #87A7D0);
            border: none;
            color: #0E1F2F;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(193, 141, 180, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #C18DB4;
            color: #E2CAD8;
        }

        .btn-outline:hover {
            background: rgba(193, 141, 180, 0.1);
            transform: translateY(-3px);
            border-color: #87A7D0;
        }

        /* Statistics Section */
        .stats-section {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 1px solid rgba(193, 141, 180, 0.2);
            padding: 40px;
            margin-top: 20px;
        }

        .stats-section h2 {
            font-family: 'Cormorant Upright', serif;
            font-size: 36px;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #E2CAD8, #C18DB4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(193, 141, 180, 0.2);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(193, 141, 180, 0.5);
        }

        .stat-number {
            font-family: 'Cormorant Upright', serif;
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #E2CAD8, #C18DB4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #87A7D0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-description {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
        }

        .info-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(193, 141, 180, 0.2);
        }

        /* Loading Spinner */
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(193, 141, 180, 0.3);
            border-top-color: #C18DB4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 48px;
            }
            
            .button-container {
                gap: 15px;
            }
            
            .btn {
                padding: 12px 28px;
                font-size: 14px;
            }
            
            .stats-section h2 {
                font-size: 28px;
            }
            
            .stat-number {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>
    
    <div class="container">
        <div class="hero">
            <h1>Diabetes Risk Analysis AI</h1>
            <p>Advanced predictive analytics using deep learning to assess diabetes risk profiles</p>
        </div>

        <div class="button-container">
            <a href="/login" class="btn btn-primary"> Login</a>
            <a href="/signup" class="btn btn-outline"> Sign Up</a>
            <button class="btn btn-outline" onclick="showStatistics()"> View Statistics</button>
        </div>

        <div id="statsSection" class="stats-section" style="display: none;">
            <h2>Global Health Statistics</h2>
            <div id="loadingSpinner" class="loading-spinner">
                <div class="spinner"></div>
                <p>Loading statistics...</p>
            </div>
            <div id="statsContent"></div>
            <div class="info-text">
                <p> These statistics are based on aggregated anonymous data.</p>
                <p> Login or Sign up to get your personalized risk assessment.</p>
            </div>
        </div>
    </div>

    <script>
       async function showStatistics() {
        const statsSection = document.getElementById('statsSection');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const statsContent = document.getElementById('statsContent');
        
        statsSection.style.display = 'block';
        loadingSpinner.style.display = 'block';
        statsContent.innerHTML = '';
        
        statsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        
        try {
            const response = await fetch('/api/public-statistics');
            const data = await response.json();
            
            loadingSpinner.style.display = 'none';
            
            if (data.success) {
                statsContent.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number">${data.total_assessments.toLocaleString()}</div>
                            <div class="stat-label">Total Individuals</div>
                            <div class="stat-description">Analyzed in dataset</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${data.high_risk_percentage}%</div>
                            <div class="stat-label">Diabetes Prevalence</div>
                            <div class="stat-description">${data.diabetic_count?.toLocaleString() || 0} individuals</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${data.avg_age}</div>
                            <div class="stat-label">Average Age</div>
                            <div class="stat-description">Years</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${data.avg_bmi}</div>
                            <div class="stat-label">Average BMI</div>
                            <div class="stat-description">Body Mass Index</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${data.avg_glucose}</div>
                            <div class="stat-label">Avg Glucose Level</div>
                            <div class="stat-description">mg/dL</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${data.female_count?.toLocaleString() || 0}</div>
                            <div class="stat-label">Female</div>
                            <div class="stat-description">${data.male_count?.toLocaleString() || 0} Male</div>
                        </div>
                    </div>
                    <div style="margin-top: 20px; padding: 15px; background: rgba(135,167,208,0.1); border-radius: 15px;">
                        <p style="text-align: center; font-size: 14px; line-height: 1.6;">
                            <strong style="color: #C18DB4;"> Dataset Insight:</strong> ${data.insight}
                        </p>
                    </div>
                `;
            } else {
                statsContent.innerHTML = `<div class="info-text" style="color: #ef5350;"><p>Unable to load statistics. Please try again later.</p></div>`;
            }
        } catch (error) {
            loadingSpinner.style.display = 'none';
            statsContent.innerHTML = `<div class="info-text" style="color: #ef5350;"><p>⚠️ Unable to load dataset. Please check if the CSV file exists.</p></div>`;
        }
    }
    </script>
</body>
</html>
